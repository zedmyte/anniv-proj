# Save as .github/workflows/flutter-build.yml in your repository
name: Flutter build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # lets you run it manually from the Actions tab

env:
  FLUTTER_VERSION: "3.27.4" # pin to the version your project uses

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/app-android-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 30

  build_ios:
    runs-on: macos-latest # GitHub-hosted Mac, so you don't need your own
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned build: AltStore re-signs the IPA with your Apple ID on install
      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry "dist/app-ios-${GITHUB_SHA::7}.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: dist/*.ipa
          retention-days: 30

  # Optional: attach both files to a GitHub Release when you push a tag like v1.0.0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_android, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
